name: publish benchmarks

# The study repo owns the numbers; the site publishes them. Joining those two
# used to be a human running render_site.py and pasting the output into the
# site repo -- and it did not happen: the site said "No numbers yet! Check
# back soon." for weeks after the eleven-model run was scored and committed.
#
# This job removes the human from that path. Whenever results/ changes on
# main, it regenerates the page and opens a pull request against the site.
# It opens a PR rather than pushing, because the page is published content
# and a person should still look at it.
#
# It needs a token that can write to foothills-labs.github.io -- the default
# GITHUB_TOKEN is scoped to this repository only. Store a fine-grained PAT
# with Contents: read and write and Pull requests: read and write on that
# repo as the SITE_PUBLISH_TOKEN secret.
#
# Without the secret the job SKIPS rather than fails, following the same rule
# as the site's vendor-parity workflow: forks and outside pull requests never
# receive secrets, and failing them for that is noise. That does mean the
# automation is inert until the secret is set -- check the run summary.

# DISABLED on the push trigger, 2026-08-19. render_site.py emits a table
# ordered one-to-eleven by usable@3, and ARTICLE.md's "What we are not
# claiming" says plainly: "We started out building a leaderboard. We are not
# publishing one. [...] Bands are defensible. A numbered list from one to
# eleven is not." Automating that publication would republish the thing the
# study declines to publish, every time results/ changed.
#
# Re-enable the push trigger once render_site.py emits bands rather than a
# ranking, and once the pass_at_k short-task defect (REVISION-PLAN.md part 2
# item 5) is fixed upstream in regexbench and the scores re-run. Until then
# this is manual-only, so a person has to look at what goes out.
on:
  workflow_dispatch:
    inputs:
      run:
        description: "Which run to publish"
        default: "sweep"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RUN: ${{ inputs.run || 'sweep' }}
    steps:
      - name: Check out the study
        uses: actions/checkout@v4
        with:
          path: study

      - name: Is the site token available?
        id: token
        env:
          SITE_TOKEN: ${{ secrets.SITE_PUBLISH_TOKEN }}
        run: |
          if [ -n "$SITE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Benchmark publish skipped"
              echo ""
              echo "No \`SITE_PUBLISH_TOKEN\` secret, so the site repo could not be written."
              echo "Expected on forks and outside pull requests. If you see this on a push to"
              echo "\`main\` in the canonical repo, the automation is not actually running:"
              echo "add the secret, or the site will drift from the results again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the site
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: foothills-labs/foothills-labs.github.io
          token: ${{ secrets.SITE_PUBLISH_TOKEN }}
          path: site

      - uses: actions/setup-python@v5
        if: steps.token.outputs.available == 'true'
        with:
          python-version: "3.11"

      # render_site.py recovers the run date from config.RUN_DATES and the
      # task count from the summary, so this needs no arguments that a person
      # would have to keep in step with the data.
      - name: Regenerate the benchmarks page
        if: steps.token.outputs.available == 'true'
        run: |
          cd study
          python3 runner/render_site.py --run "$RUN" \
            --out "$GITHUB_WORKSPACE/site/benchmarks/index.html"

      - name: Open a pull request against the site if it changed
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_PUBLISH_TOKEN }}
        run: |
          cd site
          if git diff --quiet -- benchmarks/index.html; then
            echo "### Benchmarks already current" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The regenerated page matches what the site is serving. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="chore/publish-benchmarks-${GITHUB_SHA::7}"
          git config user.name "Adrian Tame"
          git config user.email "31286933+AdrianTJ@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add benchmarks/index.html
          git commit -m "Publish the ${RUN} benchmark results

          Generated by regexleaderboard's publish-benchmarks workflow from
          results/${RUN} at ${GITHUB_SHA}. The study repo owns the numbers;
          this file is its rendering and is never hand-edited."
          git push origin "$BRANCH"

          gh pr create \
            --repo foothills-labs/foothills-labs.github.io \
            --base main --head "$BRANCH" \
            --title "Publish the ${RUN} benchmark results" \
            --body "Automated from [regexleaderboard@${GITHUB_SHA::7}](https://github.com/foothills-labs/regexleaderboard/commit/${GITHUB_SHA}).

          \`results/${RUN}\` changed, so \`/benchmarks/\` was regenerated by \`runner/render_site.py\`.

          This page is generated output. Review the numbers, not the markup, and never hand-edit it here: change the study and let this workflow re-render." \
            | tee -a "$GITHUB_STEP_SUMMARY"
